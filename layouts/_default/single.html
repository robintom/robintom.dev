{{ define "main" }}
<div class="page-single">
  <a href="{{ .Parent.Permalink }}" class="back-link">Back</a>

  <article>
    <header class="post-header">
      <h1 class="post-title">{{ .Title }}</h1>
      <div class="page-meta">
        <time datetime="{{ .Date.Format "2006-01-02" }}">
          {{ .Date.Format "Jan 2, 2006" }}
        </time>
      </div>
    </header>

    <div class="content">
      {{ .Content }}
    </div>
  </article>
</div>
{{ end }}
