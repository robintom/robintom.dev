<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}" data-theme="light">
<head>
  {{- partial "head.html" . -}}
</head>
<body>
  {{/* Film grain sits over the whole page, as it does on every artboard. */}}
  <div class="grain" aria-hidden="true"></div>

  {{- partial "header.html" . -}}

  <main class="main">
    {{- block "main" . }}{{- end }}
  </main>

  {{- partial "footer.html" . -}}

  <script src="/js/theme.js"></script>
  <script src="/js/tag-filter.js"></script>
  <script src="/js/site.js"></script>
</body>
</html>
