{{ define "main" }}
<div class="page-single">
  <a href="/til/" class="back-link">All TILs</a>

  <article>
    <header class="post-header">
      <h1 class="post-title">{{ .Title | .RenderString }}</h1>
      <div class="page-meta">
        <time datetime="{{ .Date.Format "2006-01-02" }}">
          {{ .Date.Format "Jan 2, 2006" }}
        </time>
        {{ with .Params.tags }}
          <div class="tags">
            {{ range . }}
              <a href="/tags/{{ . | urlize }}/" class="tag">{{ . }}</a>
            {{ end }}
          </div>
        {{ end }}
      </div>
    </header>

    <div class="content">
      {{ .Content }}
    </div>
  </article>
</div>
{{ end }}
