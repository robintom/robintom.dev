<header class="header">
  <nav class="nav">
    <a href="/" class="nav-logo">{{ .Site.Title }}</a>

    <div class="nav-links">
      <a href="/" class="nav-link{{ if .IsHome }} active{{ end }}">Home</a>
      <a href="/posts/" class="nav-link{{ if eq .Section "posts" }} active{{ end }}">Posts</a>
      <a href="/til/" class="nav-link{{ if eq .Section "til" }} active{{ end }}">TIL</a>
      <a href="/about/" class="nav-link{{ if eq .Title "About" }} active{{ end }}">About</a>

      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode" title="Toggle theme">
        <span class="icon-sun">&#9728;</span>
        <span class="icon-moon">&#9790;</span>
      </button>
    </div>
  </nav>
</header>
