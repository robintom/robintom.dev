# =============================================================================
# Hugo Configuration
# =============================================================================
# This is the main configuration file for your Hugo site.
# Docs: https://gohugo.io/getting-started/configuration/

baseURL = 'https://robintom.dev/'
languageCode = 'en-us'
title = 'Robin Tom'

# Theme is built into /layouts, no external theme needed

# =============================================================================
# Site Parameters
# =============================================================================
# Custom parameters accessible via {{ .Site.Params.xxx }} in templates

[params]
  description = "Developer blog - thoughts on code, tech, and building things"
  author = "Robin Tom"
  avatar = "/images/profile.jpg"

  # Social links (used in footer and the About page)
  github = "https://github.com/robintom"
  twitter = ""
  linkedin = ""
  # Set this and the About page's third pill ("Email") appears automatically.
  email = "hi@robintom.dev"

  # Hero eyebrow, shown next to the avatar on the home page
  tagline = "Developer \u00b7 writes about the journey"

  # Words cycled through in the home hero: "I build <word> \u2014 and write about the journey."
  rotatingWords = [
    "small experiments",
    "things that work",
    "bugs I later blog about",
    "side projects I swear I\u2019ll finish",
  ]

  # Colophon line in the footer
  colophon = "Built with Hugo \u00b7 Cloudflare Pages"

  # Closing band on the home page. Markdown emphasis in the headline renders as
  # the ember italic. Clear closingHeadline to drop the band entirely.
  closingHeadline = "I enjoy building things that *work well.*"
  closingText = "Systems programming, web development, and understanding how things work under the hood."

# =============================================================================
# Permalinks
# =============================================================================
# Control URL structure for content

[permalinks]
  posts = '/posts/:slug/'

# =============================================================================
# Taxonomies
# =============================================================================
# How content is categorized

[taxonomies]
  tag = 'tags'

# =============================================================================
# Markup Settings
# =============================================================================
# Configure markdown rendering and syntax highlighting

[markup]
  # Table of contents settings
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

  # Goldmark is Hugo's default markdown parser
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true  # Allow raw HTML in markdown if needed

  # Syntax highlighting for code blocks
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = true
    hl_Lines = ''
    hl_inline = false
    lineAnchors = ''
    lineNoStart = 1
    lineNos = false
    lineNumbersInTable = true
    noClasses = false  # Use CSS classes so code blocks follow the light/dark theme
    noHl = false
    style = 'dracula'  # Unused when noClasses=false; token colors live in style.css
    tabWidth = 4

# =============================================================================
# Output Formats
# =============================================================================
# Define what formats Hugo should output

[outputs]
  home = ['HTML', 'RSS']
  section = ['HTML', 'RSS']
  taxonomy = ['HTML']
  term = ['HTML']

# =============================================================================
# Build Settings
# =============================================================================

[build]
  writeStats = false

# Minification settings (used with hugo --minify)
[minify]
  [minify.tdewolff]
    [minify.tdewolff.html]
      keepWhitespace = false
    [minify.tdewolff.css]
      precision = 0
    [minify.tdewolff.js]
      precision = 0
